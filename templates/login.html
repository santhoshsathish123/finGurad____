<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FinGuard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); }
      50% { transform: scale(1.15) translate(20px, -20px); }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    .animate-orb1 { animation: pulseOrb 8s infinite ease-in-out; }
    .animate-orb2 { animation: floatOrb 10s infinite ease-in-out; }
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glow-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body class="bg-[#080B10] text-white font-sans min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

  <!-- Ambient Liquid Orbs -->
  <div class="absolute w-[280px] h-[280px] bg-cyan-400/50 rounded-full blur-[80px] top-12 left-6 animate-orb1 pointer-events-none"></div>
  <div class="absolute w-[300px] h-[300px] bg-fuchsia-600/50 rounded-full blur-[90px] bottom-10 right-6 animate-orb2 pointer-events-none"></div>

  <!-- Main Glassmorphism Card -->
  <div class="glass-card w-full max-w-sm rounded-[32px] p-8 relative z-10 transition-all duration-500">
    
    <!-- Login Form View -->
    <div id="login-view">
      <div class="flex justify-center mb-4">
        <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center text-xl font-extrabold text-white shadow-lg shadow-blue-500/30">
          L
        </div>
      </div>

      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold tracking-tight">Welcome Back</h2>
        <p class="text-xs text-slate-300/80 mt-1">Login to continue your journey</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div class="relative">
          <input type="email" id="email" required placeholder=" " class="glow-input peer w-full bg-black/20 text-white text-sm rounded-xl px-4 pt-5 pb-2 outline-none border border-white/20 transition-all"/>
          <label for="email" class="absolute text-xs text-slate-300 left-4 top-2 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-2 peer-focus:text-xs peer-focus:text-blue-400">Email Address</label>
        </div>

        <div class="relative">
          <input type="password" id="password" required placeholder=" " class="glow-input peer w-full bg-black/20 text-white text-sm rounded-xl px-4 pt-5 pb-2 outline-none border border-white/20 transition-all"/>
          <label for="password" class="absolute text-xs text-slate-300 left-4 top-2 transition-all peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:text-slate-400 peer-focus:top-2 peer-focus:text-xs peer-focus:text-blue-400">Password</label>
        </div>

        <div class="flex items-center justify-between text-xs text-slate-300 pt-1">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" class="accent-blue-500 rounded cursor-pointer">
            <span>Remember me</span>
          </label>
          <a href="#" class="text-blue-400 hover:underline">Forgot Password?</a>
        </div>

        <button type="submit" class="w-full mt-4 py-3 rounded-xl bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-600 font-bold text-white text-sm shadow-lg shadow-cyan-500/30 hover:opacity-90 active:scale-[0.98] transition-all">
          LOGIN
        </button>
      </form>

      <p class="text-center text-xs text-slate-300 mt-6">
        Don't have an account? <a href="#" class="text-blue-400 font-semibold hover:underline">Create Account</a>
      </p>
    </div>

    <!-- Success View -->
    <div id="success-view" class="hidden flex flex-col items-center justify-center py-8 text-center space-y-4">
      <div class="w-16 h-16 rounded-full bg-green-500/20 border-2 border-green-500 flex items-center justify-center text-green-400 text-3xl font-bold shadow-lg shadow-green-500/30 animate-bounce">
        ✓
      </div>
      <h3 class="text-2xl font-bold text-white">Login Successful!</h3>
      <p class="text-xs text-slate-300">Redirecting to biometric verification...</p>
    </div>

  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const loginView = document.getElementById('login-view');
      const successView = document.getElementById('success-view');

      loginView.classList.add('opacity-0');
      
      setTimeout(() => {
        loginView.classList.add('hidden');
        successView.classList.remove('hidden');
        
        // Omdirigerar till fingeravtryckssidan i Flask (/fingerprint)
        setTimeout(() => {
          window.location.href = '/fingerprint';
        }, 1200);
      }, 300);
    }
  </script>
</body>
</html>
